name: Build Extensions

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build CloudStream Extensions (.cs3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Plugins (.cs3)
        run: ./gradlew make

      - name: Upload Extension Artifacts (.cs3)
        uses: actions/upload-artifact@v4
        with:
          name: CloudStream-TamilExtensions-cs3
          path: |
            **/*.cs3
            build/plugins.json
          if-no-files-found: warn
