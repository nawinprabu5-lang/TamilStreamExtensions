name: Build Extensions & Deploy Repository

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Deploy Extension Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout Builds Branch
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Clean Old Builds
        run: |
          rm -rf builds/*.cs3
          rm -rf builds/plugins.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        run: |
          cd src
          chmod +x gradlew

      - name: Build Plugins & Manifest
        run: |
          cd src
          ./gradlew make makePluginsJson
          cp **/build/*.cs3 ../builds/ 2>/dev/null || true
          cp build/plugins.json ../builds/ 2>/dev/null || true

      - name: Generate Repo Manifest
        run: |
          cat << 'EOF' > builds/repo.json
          {
            "name": "TamilStream Extensions",
            "description": "Isaimini & IsaiDub Extensions for CloudStream",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/nawinprabu5-lang/TamilStreamExtensions/builds/plugins.json"
            ]
          }
          EOF

      - name: Upload Extension Artifacts (.cs3)
        uses: actions/upload-artifact@v4
        with:
          name: CloudStream-TamilExtensions-cs3
          path: |
            builds/*.cs3
            builds/plugins.json
            builds/repo.json

      - name: Commit & Push Builds to Repository Branch
        run: |
          cd builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit -m "Automated build: ${{ github.sha }}" || exit 0
          git push origin builds
